<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>შესვლა | Food House</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/auth.js" defer></script>
    <script src="js/common.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                Food<span>House.</span>
            </a>

            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="მენიუს გახსნა"
                aria-controls="navMenu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-menu" id="navMenu" aria-label="მთავარი ნავიგაცია">
                <a href="index.html">მთავარი</a>
                <a href="menu.html">მენიუ</a>

                <a href="orders.html" class="orders-link">
                    ჩემი შეკვეთები
                    <span
                        class="orders-badge"
                        id="ordersBadge"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></span>
                </a>

                <div class="nav-auth" id="authArea">
                    <a href="login.html" class="button button-small button-outline">
                        შესვლა
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="auth-card" aria-labelledby="loginTitle">
            <div class="auth-heading">
                <p class="eyebrow">კეთილი იყოს შენი დაბრუნება</p>
                <h1 id="loginTitle">შედი ანგარიშში</h1>
                <p>შეარჩიე შენი საყვარელი კერძები.</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-field">
                    <label for="loginEmail">ელფოსტა</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="name@example.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="loginPassword">პაროლი</label>
                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="შეიყვანე პაროლი"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p
                    id="loginMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="button button-primary auth-submit">
                    შესვლა
                </button>

                <p class="auth-switch">
                    ჯერ არ გაქვს ანგარიში?
                    <a href="register.html">რეგისტრაცია</a>
                </p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a href="index.html" class="logo">
                Food<span>House.</span>
            </a>

            <p>
                © <span id="currentYear"></span>
                Food House. ყველა უფლება დაცულია.
            </p>
        </div>
    </footer>
</body>
</html>
